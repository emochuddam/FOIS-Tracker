name: Build FOIS APK
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a signed GitHub release with this new tag. Leave empty for a debug artifact.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify signed APK and write checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FOIS-Tracker.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/FOIS-Tracker.apk
          (cd dist && sha256sum FOIS-Tracker.apk > FOIS-Tracker.apk.sha256)
      - uses: actions/upload-artifact@v7.0.2
        id: apk
        with:
          name: FOIS-Tracker-APK
          path: dist/
          if-no-files-found: error
      - name: Link to APK
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: printf '### [Download debug APK artifact](%s)\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: FOIS-Tracker-Unit-Tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  device-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Enable emulator access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: FOIS-Tracker-Device-Tests
          path: app/build/outputs/androidTest-results/connected/debug/
          if-no-files-found: warn

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [apk, device-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Sign and publish authorized release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FOIS_KEYSTORE_BASE64: ${{ secrets.FOIS_RELEASE_KEYSTORE_BASE64 }}
          FOIS_RELEASE_STORE_PASSWORD: ${{ secrets.FOIS_RELEASE_STORE_PASSWORD }}
          FOIS_RELEASE_KEY_ALIAS: ${{ secrets.FOIS_RELEASE_KEY_ALIAS }}
          FOIS_RELEASE_KEY_PASSWORD: ${{ secrets.FOIS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$FOIS_KEYSTORE_BASE64"
          test -n "$FOIS_RELEASE_STORE_PASSWORD"
          test -n "$FOIS_RELEASE_KEY_ALIAS"
          test -n "$FOIS_RELEASE_KEY_PASSWORD"
          export FOIS_RELEASE_KEYSTORE="$RUNNER_TEMP/fois-release.jks"
          trap 'rm -f "$FOIS_RELEASE_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$FOIS_KEYSTORE_BASE64" | base64 --decode > "$FOIS_RELEASE_KEYSTORE"
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FOIS-Tracker.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/FOIS-Tracker.apk
          (cd dist && sha256sum FOIS-Tracker.apk > FOIS-Tracker.apk.sha256)
          gh release create --target "$GITHUB_SHA" --generate-notes -- "$RELEASE_TAG" dist/FOIS-Tracker.apk dist/FOIS-Tracker.apk.sha256
