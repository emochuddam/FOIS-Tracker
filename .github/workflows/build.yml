name: Build FOIS APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk FOIS-Tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FOIS-Tracker-APK
          path: FOIS-Tracker.apk
          if-no-files-found: error
